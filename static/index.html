<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pegasus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-title">
          <h1>Pegasus</h1>
          <img
            src="pegasus.svg"
            alt="Pegasus Logo"
            id="header-logo"
            class="filter-blue"
          />
        </div>
        <p class="tagline">Swiftly process and deliver your media files</p>
        <nav class="main-nav">
          <ul>
            <li><a href="#submit-section">Submit</a></li>
            <li><a href="#queue-section">Queue</a></li>
            <li><a href="#settings-section">Settings</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <section id="submit-section">
          <h2>Submit a URL</h2>
          <form id="download-form">
            <input
              type="text"
              id="url"
              placeholder="Enter media URL (e.g., YouTube, SoundCloud)"
              required
            />
            <button type="submit">Download</button>
          </form>
          <div id="response"></div>
        </section>

        <section id="queue-section">
          <h2>Download Queue</h2>
          <div id="queue-container"></div>
        </section>

        <section id="settings-section">
          <h2>Settings</h2>
          <p>Settings will be available in a future version.</p>
        </section>
      </main>
    </div>

    <template id="job-template">
      <div class="job-item" data-job-id="">
        <div class="job-info">
          <span class="job-url"></span>
          <span class="job-message"></span>
        </div>
        <div class="job-status"></div>
        <div class="job-progress-container">
          <progress class="job-progress" value="0" max="1"></progress>
        </div>
        <div class="job-actions">
          <button class="cancel-btn">Cancel</button>
        </div>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
